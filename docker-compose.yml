# Production deployment of inthiseconomygenz.id.
#
#   cp .env.example .env      # then fill in the values
#   docker compose up -d --build                  # the app
#   docker compose --profile api up -d --build    # also the HTTP API for curl
#
# Ports are published on 127.0.0.1 by default, for a reverse proxy or load
# balancer on this host that terminates HTTPS. Set APP_BIND=0.0.0.0 to expose
# a port to the network directly.
# Budgets and users live in the `app-data` volume: back it up.

name: inthiseconomygenz

services:
  app:
    build: .
    image: inthiseconomygenz:latest
    restart: unless-stopped
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-5006}:5006"
    environment:
      ENVELOPE_LOGIN_METHOD: multiuser
      ENVELOPE_PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      ENVELOPE_ADMIN_USER: ${ADMIN_USER:-admin}
      ENVELOPE_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ENVELOPE_ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Google sign-in: leave empty to use passwords only.
      ENVELOPE_OPENID_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ENVELOPE_OPENID_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ENVELOPE_ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-}
      # Addresses of your reverse proxy, so login rate limits see real client
      # IPs. Leave empty when clients connect directly.
      ENVELOPE_TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      ENVELOPE_UPLOAD_LIMIT_MB: ${UPLOAD_LIMIT_MB:-50}
    volumes:
      - app-data:/data
    networks: [internal]
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  http-api:
    image: inthiseconomygenz:latest
    profiles: [api]
    restart: unless-stopped
    command: ["node", "--import", "tsx", "packages/http-api/src/index.ts"]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-5007}:5007"
    environment:
      HEALTH_PORT: "5007"
      ENVELOPE_API_HOST: 0.0.0.0
      ENVELOPE_API_PORT: "5007"
      ENVELOPE_API_DATA_DIR: /data/http-api
      ENVELOPE_API_KEYS: ${API_KEYS:-}  # required when the api profile runs; the service exits without it
      ENVELOPE_URL: http://app:5006
      ENVELOPE_USER: ${API_USER:-admin}
      ENVELOPE_PASSWORD: ${API_PASSWORD:-}
      ENVELOPE_KEY_PASSWORD: ${API_KEY_PASSWORD:-}
    volumes:
      - api-data:/data
    networks: [internal]
    logging: *logging

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  app-data:
  api-data:
